<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — Studievereniging Aperture</title>
  <meta name="description" content="Upcoming events and annual traditions organised by Aperture and its committees and clubs at MSP.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="events">

  <header class="site-header">
    <div class="container">
      <a href="./" class="site-logo"><img src="images/aperture_logo.jpg" alt="Aperture Logo"><span>Aperture</span></a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <ul class="nav-links"></ul>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Events</h1>
      <p class="section-subtitle">Check out upcoming events organised by Aperture and its committees and clubs. For the latest updates, follow us on Instagram or join our WhatsApp community.</p>

      <h2 class="mt-4 mb-2">Upcoming Events</h2>
      <div id="eventsList"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <h2 class="section-title">Annual Traditions</h2>
      <p class="section-subtitle">Things that make MSP, MSP.</p>
      <div class="traditions-grid" id="traditionsGrid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container"></div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
